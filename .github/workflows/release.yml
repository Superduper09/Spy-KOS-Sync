name: Attach Spy.zip to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build Spy.zip
        run: git archive --format=zip --prefix=Spy/ -o Spy.zip "${{ github.event.release.tag_name }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Spy.zip --clobber
